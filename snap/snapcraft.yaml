name: flutter_tiqlo_clock
version: 1.0.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-flutter_tiqlo_clock: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.flutter_tiqlo_clock # adjust accordingly to your app name

apps:
  flutter_tiqlo_clock:
    command: flutter_tiqlo_clock
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-flutter_tiqlo_clock
parts:
  flutter_tiqlo_clock:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
