<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171612" />
    <title>Tiqlo Settings</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              pixel: {
                text: '#fffdf7',
                outline: '#5b554b',
                section: '#b8a77c',
              },
            },
            fontFamily: {
              pixel: ['Pixelify Sans', 'ui-monospace', 'monospace'],
            },
          },
        },
      };
    </script>

    <style>
      @font-face {
        font-family: 'Pixelify Sans';
        src: url('../../fonts/PixelifySans-Regular.ttf') format('truetype');
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }

      @font-face {
        font-family: 'Pixelify Sans';
        src: url('../../fonts/PixelifySans-SemiBold.ttf') format('truetype');
        font-style: normal;
        font-weight: 600;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --surface: #26231f;
        --surface-high: #2b2823;
        --outline: #5b554b;
        --shadow: #050504;
        --panel-outer: polygon(
          10px 0,
          calc(100% - 10px) 0,
          calc(100% - 10px) 2px,
          calc(100% - 6px) 2px,
          calc(100% - 6px) 4px,
          calc(100% - 4px) 4px,
          calc(100% - 4px) 6px,
          calc(100% - 2px) 6px,
          calc(100% - 2px) 10px,
          100% 10px,
          100% calc(100% - 10px),
          calc(100% - 2px) calc(100% - 10px),
          calc(100% - 2px) calc(100% - 6px),
          calc(100% - 4px) calc(100% - 6px),
          calc(100% - 4px) calc(100% - 4px),
          calc(100% - 6px) calc(100% - 4px),
          calc(100% - 6px) calc(100% - 2px),
          calc(100% - 10px) calc(100% - 2px),
          calc(100% - 10px) 100%,
          10px 100%,
          10px calc(100% - 2px),
          6px calc(100% - 2px),
          6px calc(100% - 4px),
          4px calc(100% - 4px),
          4px calc(100% - 6px),
          2px calc(100% - 6px),
          2px calc(100% - 10px),
          0 calc(100% - 10px),
          0 10px,
          2px 10px,
          2px 6px,
          4px 6px,
          4px 4px,
          6px 4px,
          6px 2px,
          10px 2px
        );
        --panel-middle: polygon(
          8px 0,
          calc(100% - 8px) 0,
          calc(100% - 8px) 2px,
          calc(100% - 4px) 2px,
          calc(100% - 4px) 4px,
          calc(100% - 2px) 4px,
          calc(100% - 2px) 8px,
          100% 8px,
          100% calc(100% - 8px),
          calc(100% - 2px) calc(100% - 8px),
          calc(100% - 2px) calc(100% - 4px),
          calc(100% - 4px) calc(100% - 4px),
          calc(100% - 4px) calc(100% - 2px),
          calc(100% - 8px) calc(100% - 2px),
          calc(100% - 8px) 100%,
          8px 100%,
          8px calc(100% - 2px),
          4px calc(100% - 2px),
          4px calc(100% - 4px),
          2px calc(100% - 4px),
          2px calc(100% - 8px),
          0 calc(100% - 8px),
          0 8px,
          2px 8px,
          2px 4px,
          4px 4px,
          4px 2px,
          8px 2px
        );
        --panel-inner: polygon(
          6px 0,
          calc(100% - 6px) 0,
          calc(100% - 6px) 2px,
          calc(100% - 2px) 2px,
          calc(100% - 2px) 6px,
          100% 6px,
          100% calc(100% - 6px),
          calc(100% - 2px) calc(100% - 6px),
          calc(100% - 2px) calc(100% - 2px),
          calc(100% - 6px) calc(100% - 2px),
          calc(100% - 6px) 100%,
          6px 100%,
          6px calc(100% - 2px),
          2px calc(100% - 2px),
          2px calc(100% - 6px),
          0 calc(100% - 6px),
          0 6px,
          2px 6px,
          2px 2px,
          6px 2px
        );
        --switch-outer: polygon(
          14px 0,
          calc(100% - 14px) 0,
          calc(100% - 14px) 2px,
          calc(100% - 10px) 2px,
          calc(100% - 10px) 4px,
          calc(100% - 6px) 4px,
          calc(100% - 6px) 6px,
          calc(100% - 4px) 6px,
          calc(100% - 4px) 10px,
          calc(100% - 2px) 10px,
          calc(100% - 2px) 14px,
          100% 14px,
          100% 26px,
          calc(100% - 2px) 26px,
          calc(100% - 2px) 30px,
          calc(100% - 4px) 30px,
          calc(100% - 4px) 34px,
          calc(100% - 6px) 34px,
          calc(100% - 6px) 36px,
          calc(100% - 10px) 36px,
          calc(100% - 10px) 38px,
          calc(100% - 14px) 38px,
          calc(100% - 14px) 40px,
          14px 40px,
          14px 38px,
          10px 38px,
          10px 36px,
          6px 36px,
          6px 34px,
          4px 34px,
          4px 30px,
          2px 30px,
          2px 26px,
          0 26px,
          0 14px,
          2px 14px,
          2px 10px,
          4px 10px,
          4px 6px,
          6px 6px,
          6px 4px,
          10px 4px,
          10px 2px,
          14px 2px
        );
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        background: #0b0b0a;
        -webkit-font-smoothing: none;
        font-smooth: never;
        text-rendering: optimizeSpeed;
      }

      .pixel-screen {
        background:
          radial-gradient(circle at 48% 31%, rgba(91, 85, 75, 0.13), transparent 31%),
          linear-gradient(90deg, #171612 0%, #1a1916 50%, #151410 100%);
      }

      .pixel-panel-shell {
        position: relative;
        isolation: isolate;
      }

      .pixel-panel-shell::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        background: var(--shadow);
        clip-path: var(--panel-outer);
        transform: translate(1px, 1px);
      }

      .pixel-panel-frame {
        position: relative;
        z-index: 1;
        padding: 2px;
        background: #0b0a09;
        clip-path: var(--panel-outer);
      }

      .pixel-panel-outline {
        padding: 2px;
        background: linear-gradient(180deg, #756b5b 0%, #5b554b 18%, #5b554b 82%, #39352f 100%);
        clip-path: var(--panel-middle);
      }

      .pixel-panel-content {
        overflow: hidden;
        background: var(--surface);
        clip-path: var(--panel-inner);
      }

      .pixel-row {
        position: relative;
        min-height: 63px;
        background: linear-gradient(90deg, #27241f 0%, #2a2722 54%, #26231f 100%);
      }

      .pixel-row:not(:last-child)::after {
        content: '';
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 5px;
        background: linear-gradient(
          to bottom,
          #100f0d 0,
          #100f0d 1px,
          #5b554b 1px,
          #5b554b 3px,
          #090807 3px,
          #090807 5px
        );
      }

      .pixel-row:active {
        background: #302c27;
      }

      .pixel-switch {
        position: relative;
        width: 64px;
        height: 40px;
        flex: 0 0 64px;
        align-self: center;
        margin-right: 1px;
      }

      .pixel-switch::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        background: #050504;
        clip-path: var(--switch-outer);
        transform: translate(1px, 1px);
      }

      .pixel-switch::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 1;
        background: #0b0a09;
        clip-path: var(--switch-outer);
      }

      .pixel-switch input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .switch-track {
        position: absolute;
        inset: 2px;
        z-index: 2;
        cursor: pointer;
        background: #5b554b;
        clip-path: polygon(
          10px 0,
          calc(100% - 10px) 0,
          calc(100% - 10px) 2px,
          calc(100% - 6px) 2px,
          calc(100% - 6px) 4px,
          calc(100% - 3px) 4px,
          calc(100% - 3px) 8px,
          calc(100% - 1px) 8px,
          calc(100% - 1px) 10px,
          100% 10px,
          100% 26px,
          calc(100% - 1px) 26px,
          calc(100% - 1px) 28px,
          calc(100% - 3px) 28px,
          calc(100% - 3px) 32px,
          calc(100% - 6px) 32px,
          calc(100% - 6px) 34px,
          calc(100% - 10px) 34px,
          calc(100% - 10px) 36px,
          10px 36px,
          10px 34px,
          6px 34px,
          6px 32px,
          3px 32px,
          3px 28px,
          1px 28px,
          1px 26px,
          0 26px,
          0 10px,
          1px 10px,
          1px 8px,
          3px 8px,
          3px 4px,
          6px 4px,
          6px 2px,
          10px 2px
        );
        transition: background 150ms steps(2, end);
      }

      .switch-track::before {
        content: '';
        position: absolute;
        inset: 2px;
        background: #171612;
        clip-path: polygon(
          8px 0,
          calc(100% - 8px) 0,
          calc(100% - 8px) 2px,
          calc(100% - 4px) 2px,
          calc(100% - 4px) 4px,
          calc(100% - 2px) 4px,
          calc(100% - 2px) 8px,
          100% 8px,
          100% 24px,
          calc(100% - 2px) 24px,
          calc(100% - 2px) 28px,
          calc(100% - 4px) 28px,
          calc(100% - 4px) 30px,
          calc(100% - 8px) 30px,
          calc(100% - 8px) 32px,
          8px 32px,
          8px 30px,
          4px 30px,
          4px 28px,
          2px 28px,
          2px 24px,
          0 24px,
          0 8px,
          2px 8px,
          2px 4px,
          4px 4px,
          4px 2px,
          8px 2px
        );
        box-shadow: inset 0 2px 0 #39352f, inset 0 -1px 0 #0b0b09;
        transition: background 150ms steps(2, end), box-shadow 150ms steps(2, end);
      }

      .switch-knob {
        position: absolute;
        top: 50%;
        left: 7px;
        width: 22px;
        height: 24px;
        z-index: 3;
        --knob-shape: polygon(
          6px 0,
          16px 0,
          16px 3px,
          19px 3px,
          19px 6px,
          22px 6px,
          22px 18px,
          19px 18px,
          19px 21px,
          16px 21px,
          16px 24px,
          6px 24px,
          6px 21px,
          3px 21px,
          3px 18px,
          0 18px,
          0 6px,
          3px 6px,
          3px 3px,
          6px 3px
        );
        transform: translateY(-50%);
        transition: transform 150ms steps(2, end);
      }

      .switch-knob::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        background: #2b2925;
        clip-path: var(--knob-shape);
        transform: translateY(1px);
      }

      .switch-knob::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 1;
        background: #55524d;
        clip-path: var(--knob-shape);
        box-shadow: inset 1px 1px 0 #69655f, inset -1px -1px 0 #403d38;
        transition: background 150ms steps(2, end), box-shadow 150ms steps(2, end);
      }

      .pixel-switch input:checked + .switch-track {
        background: #a3480b;
      }

      .pixel-switch input:checked + .switch-track::before {
        background: linear-gradient(to bottom, #e88a2a 0 2px, #d96b0c 2px calc(100% - 2px), #a74608 calc(100% - 2px));
        box-shadow: inset 0 2px 0 #ed9232, inset 0 -1px 0 #b55410;
      }

      .pixel-switch input:checked + .switch-track .switch-knob {
        transform: translate(24px, -50%);
      }

      .pixel-switch input:checked + .switch-track .switch-knob::before {
        background: #783006;
      }

      .pixel-switch input:checked + .switch-track .switch-knob::after {
        background: #f4f0e6;
        box-shadow: inset 1px 1px 0 #fffdf7, inset -1px -1px 0 #d8d1c4;
      }

      .pixel-switch input:focus-visible + .switch-track {
        outline: 3px solid #fffdf4;
        outline-offset: 4px;
      }

      .pixel-island {
        clip-path: polygon(
          14px 0,
          calc(100% - 14px) 0,
          calc(100% - 14px) 2px,
          calc(100% - 8px) 2px,
          calc(100% - 8px) 4px,
          calc(100% - 4px) 4px,
          calc(100% - 4px) 8px,
          calc(100% - 2px) 8px,
          calc(100% - 2px) 14px,
          100% 14px,
          100% calc(100% - 14px),
          calc(100% - 2px) calc(100% - 14px),
          calc(100% - 2px) calc(100% - 8px),
          calc(100% - 4px) calc(100% - 8px),
          calc(100% - 4px) calc(100% - 4px),
          calc(100% - 8px) calc(100% - 4px),
          calc(100% - 8px) calc(100% - 2px),
          calc(100% - 14px) calc(100% - 2px),
          calc(100% - 14px) 100%,
          14px 100%,
          14px calc(100% - 2px),
          8px calc(100% - 2px),
          8px calc(100% - 4px),
          4px calc(100% - 4px),
          4px calc(100% - 8px),
          2px calc(100% - 8px),
          2px calc(100% - 14px),
          0 calc(100% - 14px),
          0 14px,
          2px 14px,
          2px 8px,
          4px 8px,
          4px 4px,
          8px 4px,
          8px 2px,
          14px 2px
        );
      }

      @media (prefers-reduced-motion: reduce) {
        .switch-track,
        .switch-track::before,
        .switch-knob,
        .switch-knob::after {
          transition: none;
        }
      }
    </style>
  </head>

  <body class="min-h-screen font-pixel text-pixel-text">
    <main class="pixel-screen mx-auto min-h-[100svh] w-full max-w-[426px] overflow-hidden shadow-2xl shadow-black">
      <header class="h-[126px] border-b-2 border-black/35 bg-black/20 px-[22px] pt-[max(14px,env(safe-area-inset-top))]">
        <div class="relative flex h-[40px] items-center justify-between text-[24px] font-semibold leading-none">
          <time id="status-time" datetime="21:32" class="tracking-[0.02em]">21:32</time>

          <div class="pixel-island absolute left-1/2 top-0 h-[40px] w-[142px] -translate-x-1/2 bg-black" aria-hidden="true"></div>

          <div class="ml-auto flex items-center gap-[10px]" aria-label="Wi-Fi and battery status">
            <span class="flex gap-[4px] pt-[5px]" aria-hidden="true">
              <i class="block h-[6px] w-[6px] bg-[#716d66]"></i>
              <i class="block h-[6px] w-[6px] bg-[#716d66]"></i>
              <i class="block h-[6px] w-[6px] bg-[#716d66]"></i>
            </span>
            <svg width="22" height="18" viewBox="0 0 22 18" fill="none" aria-hidden="true" shape-rendering="crispEdges">
              <path d="M1 5h3V3h3V1h8v2h3v2h3v3h-3V6h-3V5H7v1H4v2H1V5Z" fill="currentColor" />
              <path d="M5 10h3V8h6v2h3v3h-3v-2H8v2H5v-3Zm5 5h3v3h-3v-3Z" fill="currentColor" />
            </svg>
            <span class="relative h-[18px] w-[34px] border-[3px] border-pixel-text" aria-hidden="true">
              <i class="absolute bottom-[2px] left-[2px] top-[2px] w-[22px] bg-pixel-text"></i>
              <i class="absolute -right-[6px] top-[3px] h-[6px] w-[3px] bg-pixel-text"></i>
            </span>
          </div>
        </div>

        <div class="relative flex h-[71px] items-center justify-center">
          <button
            type="button"
            class="absolute left-[-10px] grid h-12 w-12 place-items-center transition hover:text-pixel-section focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-[-4px]"
            aria-label="Go back"
            onclick="if (history.length > 1) history.back()"
          >
            <svg width="22" height="30" viewBox="0 0 22 30" fill="none" aria-hidden="true" shape-rendering="crispEdges">
              <path d="M14 0h6v6h-6V0ZM8 6h6v6H8V6Zm-6 6h6v6H2v-6Zm6 6h6v6H8v-6Zm6 6h6v6h-6v-6Z" fill="currentColor" />
            </svg>
          </button>
          <h1 class="pt-1 text-center text-[31px] font-semibold leading-none tracking-[-0.02em]">Settings</h1>
        </div>
      </header>

      <div class="px-[18px] pb-[calc(28px+env(safe-area-inset-bottom))] pt-[18px]">
        <section aria-labelledby="time-date-heading">
          <h2 id="time-date-heading" class="mb-[9px] pl-[4px] text-[19px] font-semibold uppercase tracking-[0.08em] text-pixel-section">Time &amp; Date</h2>
          <div class="pixel-panel-shell">
            <div class="pixel-panel-frame">
              <div class="pixel-panel-outline">
                <div class="pixel-panel-content">
                  <label class="pixel-row flex cursor-pointer items-center justify-between gap-4 px-[19px] py-3">
                    <span class="text-[22px] font-normal leading-tight">24 Hour</span>
                    <span class="pixel-switch"><input type="checkbox" name="24-hour" aria-label="24 Hour" /><span class="switch-track"><span class="switch-knob"></span></span></span>
                  </label>
                  <label class="pixel-row flex cursor-pointer items-center justify-between gap-4 px-[19px] py-3">
                    <span class="text-[22px] font-normal leading-tight">Show Leading Zero</span>
                    <span class="pixel-switch"><input type="checkbox" name="leading-zero" aria-label="Show Leading Zero" /><span class="switch-track"><span class="switch-knob"></span></span></span>
                  </label>
                  <label class="pixel-row flex cursor-pointer items-center justify-between gap-4 px-[19px] py-3">
                    <span class="text-[22px] font-normal leading-tight">Show Seconds</span>
                    <span class="pixel-switch"><input type="checkbox" name="seconds" aria-label="Show Seconds" /><span class="switch-track"><span class="switch-knob"></span></span></span>
                  </label>
                  <label class="pixel-row flex cursor-pointer items-center justify-between gap-4 px-[19px] py-3">
                    <span class="text-[22px] font-normal leading-tight">Date &amp; Weekday</span>
                    <span class="pixel-switch"><input type="checkbox" name="date-weekday" aria-label="Date and Weekday" /><span class="switch-track"><span class="switch-knob"></span></span></span>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="mt-[25px]" aria-labelledby="display-heading">
          <h2 id="display-heading" class="mb-[9px] pl-[4px] text-[19px] font-semibold uppercase tracking-[0.08em] text-pixel-section">Display</h2>
          <div class="pixel-panel-shell">
            <div class="pixel-panel-frame">
              <div class="pixel-panel-outline">
                <div class="pixel-panel-content">
                  <label class="pixel-row flex cursor-pointer items-center justify-between gap-4 px-[19px] py-3">
                    <span class="text-[22px] font-normal leading-tight">Keep Screen Awake</span>
                    <span class="pixel-switch"><input type="checkbox" name="screen-awake" aria-label="Keep Screen Awake" checked /><span class="switch-track"><span class="switch-knob"></span></span></span>
                  </label>
                  <label class="pixel-row flex cursor-pointer items-center justify-between gap-4 px-[19px] py-3">
                    <span class="text-[22px] font-normal leading-tight">Night Mode</span>
                    <span class="pixel-switch"><input type="checkbox" name="night-mode" aria-label="Night Mode" /><span class="switch-track"><span class="switch-knob"></span></span></span>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="mt-[25px]" aria-labelledby="alerts-heading">
          <h2 id="alerts-heading" class="mb-[9px] pl-[4px] text-[19px] font-semibold uppercase tracking-[0.08em] text-pixel-section">Alerts</h2>
          <div class="pixel-panel-shell">
            <div class="pixel-panel-frame">
              <div class="pixel-panel-outline">
                <div class="pixel-panel-content">
                  <label class="pixel-row flex cursor-pointer items-center justify-between gap-4 px-[19px] py-3">
                    <span class="text-[22px] font-normal leading-tight">Sound</span>
                    <span class="pixel-switch"><input type="checkbox" name="sound" aria-label="Sound" checked /><span class="switch-track"><span class="switch-knob"></span></span></span>
                  </label>
                  <label class="pixel-row flex cursor-pointer items-center justify-between gap-4 px-[19px] py-3">
                    <span class="text-[22px] font-normal leading-tight">Vibration</span>
                    <span class="pixel-switch"><input type="checkbox" name="vibration" aria-label="Vibration" checked /><span class="switch-track"><span class="switch-knob"></span></span></span>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script>
      const time = document.querySelector('#status-time');
      const updateTime = () => {
        const now = new Date();
        const value = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
        time.textContent = value;
        time.dateTime = value;
      };

      updateTime();
      window.setInterval(updateTime, 30_000);
    </script>
  </body>
</html>
